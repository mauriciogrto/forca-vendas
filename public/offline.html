<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f3f4f6; color: #1f2933; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; }
    main { max-width: 360px; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px; border: 1px solid #1f4e79; background: #1f4e79; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>O app precisa de internet para mostrar clientes, preços e estoque atualizados. Tente de novo quando o sinal voltar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
